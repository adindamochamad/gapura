name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: ["20", "22"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run examples:check
      - run: npm run demo
      - run: node dist/cli/main.js proxy --help
      - run: npm run mutation:patterns
      - run: npm run lint:forbidden
      - run: npm run lint:secrets
      - run: npm run verify:pack
